name: Monthly Dependency Audit

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate --json > "$env:RUNNER_TEMP\npm-audit.json"
          exit $LASTEXITCODE

      - name: Add audit results to workflow summary
        if: always()
        shell: pwsh
        run: |
          $auditPath = Join-Path $env:RUNNER_TEMP "npm-audit.json"
          if (-not (Test-Path $auditPath)) {
            "## Dependency audit`n`nAudit report was not generated." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          try {
            $audit = Get-Content -Raw $auditPath | ConvertFrom-Json
          } catch {
            "## Dependency audit`n`nThe audit report could not be parsed." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $counts = $audit.metadata.vulnerabilities
          $status = if ($counts.total -eq 0) { "Passed" } else { "Vulnerabilities found" }
          @"
          ## Dependency audit: $status

          | Severity | Count |
          | --- | ---: |
          | Critical | $($counts.critical) |
          | High | $($counts.high) |
          | Moderate | $($counts.moderate) |
          | Low | $($counts.low) |
          | Info | $($counts.info) |
          | **Total** | **$($counts.total)** |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($counts.total -gt 0) {
            $rows = foreach ($property in $audit.vulnerabilities.PSObject.Properties) {
              $vulnerability = $property.Value
              $advisory = $vulnerability.via |
                Where-Object { $_ -is [System.Management.Automation.PSCustomObject] } |
                Select-Object -First 1
              $title = if ($advisory.title) { $advisory.title } else { "Dependency vulnerability" }
              $title = $title -replace '\|', '\|'
              "| $($vulnerability.severity) | $($property.Name) | $($vulnerability.range) | $title |"
            }
            @"

          ### Affected dependencies

          | Severity | Package | Affected versions | Advisory |
          | --- | --- | --- | --- |
          $($rows -join "`n")
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
