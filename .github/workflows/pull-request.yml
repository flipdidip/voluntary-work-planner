name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test --if-present -- --coverage

      - name: Add coverage to workflow summary
        if: success()
        shell: pwsh
        run: |
          $coverage = Get-Content coverage/coverage-summary.json | ConvertFrom-Json
          $total = $coverage.total
          @"
          ## Test coverage

          | Metric | Coverage |
          | --- | ---: |
          | Statements | $($total.statements.pct)% |
          | Branches | $($total.branches.pct)% |
          | Functions | $($total.functions.pct)% |
          | Lines | $($total.lines.pct)% |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate --json > "$env:RUNNER_TEMP\npm-audit.json"
          exit $LASTEXITCODE

      - name: Add audit results to workflow summary
        if: always()
        shell: pwsh
        run: |
          $auditPath = Join-Path $env:RUNNER_TEMP "npm-audit.json"
          if (-not (Test-Path $auditPath)) {
            "## Dependency audit`n`nAudit report was not generated." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $audit = Get-Content -Raw $auditPath | ConvertFrom-Json
          $counts = $audit.metadata.vulnerabilities
          $status = if ($counts.total -eq 0) { "Passed" } else { "Vulnerabilities found" }
          @"
          ## Dependency audit: $status

          | Severity | Count |
          | --- | ---: |
          | Critical | $($counts.critical) |
          | High | $($counts.high) |
          | Moderate | $($counts.moderate) |
          | Low | $($counts.low) |
          | Info | $($counts.info) |
          | **Total** | **$($counts.total)** |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($counts.total -gt 0) {
            $rows = foreach ($property in $audit.vulnerabilities.PSObject.Properties) {
              $vulnerability = $property.Value
              $advisory = $vulnerability.via |
                Where-Object { $_ -is [System.Management.Automation.PSCustomObject] } |
                Select-Object -First 1
              $title = if ($advisory.title) { $advisory.title } else { "Dependency vulnerability" }
              $title = $title -replace '\|', '\|'
              "| $($vulnerability.severity) | $($property.Name) | $($vulnerability.range) | $title |"
            }
            @"

          ### Affected dependencies

          | Severity | Package | Affected versions | Advisory |
          | --- | --- | --- | --- |
          $($rows -join "`n")
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
